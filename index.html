<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 模型展示</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: radial-gradient(circle at top, #1f2937, #020617 65%);
        color: #e2e8f0;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      header, footer {
        padding: 14px 18px;
        background: rgba(2, 6, 23, 0.65);
        backdrop-filter: blur(4px);
      }
      header h1 {
        margin: 0;
        font-size: 18px;
      }
      #scene {
        width: 100%;
        height: calc(100vh - 110px);
      }
      .hint { opacity: 0.85; font-size: 13px; }
      .status {
        position: fixed;
        top: 56px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.3);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 13px;
      }
      .status.error { border-color: rgba(248, 113, 113, 0.7); color: #fecaca; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>3D 模型展示页</h1>
      </header>
      <main id="scene"></main>
      <footer>
        <div class="hint">鼠标左键旋转 / 滚轮缩放 / 右键平移。默认加载 <code>./model.glb</code>。</div>
      </footer>
    </div>
    <div id="status" class="status">正在加载模型...</div>

    <script type="module">
      import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';
      import { OrbitControls } from 'https://unpkg.com/three@0.165.0/examples/jsm/controls/OrbitControls.js';
      import { GLTFLoader } from 'https://unpkg.com/three@0.165.0/examples/jsm/loaders/GLTFLoader.js';

      const container = document.getElementById('scene');
      const statusEl = document.getElementById('status');

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020617);

      const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(1.8, 1.2, 2.6);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x1e293b, 1.2);
      scene.add(hemiLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight.position.set(4, 6, 3);
      scene.add(dirLight);

      const grid = new THREE.GridHelper(10, 20, 0x334155, 0x1e293b);
      grid.position.y = -0.001;
      scene.add(grid);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 0.8, 0);

      const loader = new GLTFLoader();
      loader.load(
        './model.glb',
        (gltf) => {
          const model = gltf.scene;
          scene.add(model);

          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());

          model.position.sub(center);
          model.position.y += size.y * 0.5;

          const maxSize = Math.max(size.x, size.y, size.z) || 1;
          camera.near = maxSize / 100;
          camera.far = maxSize * 100;
          camera.updateProjectionMatrix();

          camera.position.set(maxSize * 1.5, maxSize, maxSize * 1.8);
          controls.target.set(0, size.y * 0.5, 0);
          controls.update();

          statusEl.textContent = '模型加载完成';
          setTimeout(() => statusEl.style.display = 'none', 1200);
        },
        undefined,
        (err) => {
          console.error(err);
          statusEl.textContent = '模型加载失败：请确认根目录存在 model.glb';
          statusEl.classList.add('error');
        }
      );

      function animate() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      function onResize() {
        const { clientWidth, clientHeight } = container;
        camera.aspect = clientWidth / clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(clientWidth, clientHeight);
      }

      window.addEventListener('resize', onResize);
      animate();
    </script>
  </body>
</html>
